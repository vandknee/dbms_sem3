<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RiverTrace SQL Console</title><link rel="stylesheet" href="/style.css"></head>
<body>
<aside class="sidebar"><div class="brand"><span class="brand-mark">RT</span><span>RiverTrace</span></div><div class="connection"><span class="dot"></span><span><b>rivertrace_monitor</b><small>MySQL &middot; local connection</small></span></div><div class="explorer-title"><span>DATABASE EXPLORER</span><button id="refresh_catalog" class="icon-button" aria-label="Refresh catalog">&#8635;</button></div><nav id="explorer" class="explorer" aria-label="Database explorer"></nav><div class="sidebar-footer"><span class="status-dot"></span> Connected locally</div></aside>
<main class="app-shell"><header class="topbar"><div><div class="eyebrow">DATABASE MANAGEMENT CONSOLE</div><h1 id="heading">Overview</h1></div><div class="top-actions"><span class="chip">MYSQL 8.4</span></div></header><section id="controls" class="toolbar"></section><div id="notice" class="notice" role="status">Connecting to database...</div><section id="results" class="results"></section><section class="activity-panel"><div class="panel-heading"><div><span class="eyebrow">LIVE TRACE</span><h2>SQL activity</h2></div></div><div id="activity" class="activity-list"></div></section></main>
<dialog id="editor"><form id="form"><div class="dialog-heading"><div><span class="eyebrow">RECORD EDITOR</span><h2 id="form_title"></h2></div><button type="button" id="cancel" class="icon-button" aria-label="Close editor">&times;</button></div><div id="inputs" class="form-grid"></div><section class="sql-preview"><div class="eyebrow">SQL PREVIEW</div><pre id="form_sql">-</pre><div id="form_params" class="params"></div></section><p id="form_error" class="error" role="alert"></p><div class="dialog-actions"><button class="primary">Execute operation</button><button type="button" id="cancel_bottom" class="ghost">Cancel</button></div></form></dialog>
<script src="/dashboard.js"></script><script src="/workspace.js"></script></body></html>
