<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RiverTrace SQL Console</title><link rel="stylesheet" href="/style.css"></head>
<body>
<aside class="sidebar"><h2 class="explorer-title">Database explorer</h2><nav id="explorer" class="explorer" aria-label="Database explorer"></nav></aside>
<main class="app-shell"><header class="topbar"><h1 id="heading">Overview</h1><button id="add_record" class="primary">+ Add record</button></header><section id="controls" class="toolbar"></section><div id="notice" class="notice" role="status">Connecting to database...</div><section id="results" class="results"></section><section class="activity-panel"><div class="panel-heading"><h2>SQL activity</h2></div><div id="activity" class="activity-list"></div></section></main>
<dialog id="editor"><form id="form"><div class="dialog-heading"><h2 id="form_title"></h2><button type="button" id="cancel" class="icon-button" aria-label="Close editor">&times;</button></div><div id="inputs" class="form-grid"></div><section class="sql-preview"><h3>SQL preview</h3><pre id="form_sql">-</pre><div id="form_params" class="params"></div></section><p id="form_error" class="error" role="alert"></p><div class="dialog-actions"><button class="primary">Execute operation</button><button type="button" id="cancel_bottom" class="ghost">Cancel</button></div></form></dialog>
<script src="/dashboard.js"></script><script src="/workspace.js"></script></body></html>
